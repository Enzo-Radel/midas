# Vhost de exemplo para homologação — midas-homolog.enzoradel.com.br
# Copiar para /etc/apache2/sites-available/midas-homolog.conf e ajustar os
# caminhos do certificado e do .htpasswd. Ver docs/deploy.md.
#
# Requer os módulos: a2enmod ssl headers rewrite

<VirtualHost *:80>
    ServerName midas-homolog.enzoradel.com.br
    Redirect permanent / https://midas-homolog.enzoradel.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName midas-homolog.enzoradel.com.br
    DocumentRoot /var/www/midas-homolog/public

    <Directory /var/www/midas-homolog/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted

        AuthType Basic
        AuthName "Midas - homologacao"
        AuthUserFile /etc/apache2/.htpasswd-midas-homolog
        Require valid-user
    </Directory>

    # Ambiente de teste: nunca indexar, nunca confundir com o site real.
    Header always set X-Robots-Tag "noindex, nofollow"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/midas-homolog.enzoradel.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/midas-homolog.enzoradel.com.br/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/midas-homolog-error.log
    CustomLog ${APACHE_LOG_DIR}/midas-homolog-access.log combined
</VirtualHost>
