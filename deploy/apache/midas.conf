# Vhost de exemplo para produção — midas.enzoradel.com.br
# Copiar para /etc/apache2/sites-available/midas.conf e ajustar os caminhos
# do certificado (gerados pelo certbot). Ver docs/deploy.md.

<VirtualHost *:80>
    ServerName midas.enzoradel.com.br
    Redirect permanent / https://midas.enzoradel.com.br/
</VirtualHost>

<VirtualHost *:443>
    ServerName midas.enzoradel.com.br
    DocumentRoot /var/www/midas/public

    <Directory /var/www/midas/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/midas.enzoradel.com.br/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/midas.enzoradel.com.br/privkey.pem

    ErrorLog ${APACHE_LOG_DIR}/midas-error.log
    CustomLog ${APACHE_LOG_DIR}/midas-access.log combined
</VirtualHost>
